site_name: Docs as Code

theme:
  name: readthedocs

plugins:
  - search

nav:
  - Главная: index.md
  - Проект:
      - Описание: project/overview.md
      - Требования: project/requirements.md
      - Диаграммы: project/diagrams.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11.4.0/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra_css:
  - extra.css
